<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guru Creations Blog</title>
    <meta name="description" content="Insights, creative strategies, and digital growth ideas from Guru Creations." />
    <link rel="icon" href="Assets/logo-1.png" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="CSS/blog1.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar-inner">
        <a href="index.html" class="brand" aria-label="Guru Creations home">
          <span class="brand-mark">G</span>
          <span>Guru Creations</span>
        </a>

        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="PORTFOLIO.HTML">Portfolio</a>
          <a href="WEB DESIGN.HTML">Web Design</a>
          <a href="blog1.html">Blog</a>
          <a href="index.html#contact">Contact</a>
        </nav>

        <a href="mailto:gurucreations@gmail.com" class="btn btn-primary">Book a call</a>
      </div>
    </header>

    <section class="hero-section">
      <div class="container text-center">
        <span class="eyebrow">Insights & ideas</span>
        <h1>Guru Creations Blog</h1>
        <p>Fresh perspectives on branding, digital growth, content strategy, and creative execution.</p>
      </div>
    </section>

    <section class="search-filter">
      <div class="container">
        <div class="filter-row">
          <input type="text" id="search" placeholder="Search blog posts..." />
          <select id="category-filter">
            <option value="all">All Categories</option>
            <option value="social">Social Media</option>
            <option value="branding">Branding</option>
            <option value="tech">Tech</option>
          </select>
        </div>
      </div>
    </section>

    <main class="blog-posts">
      <div class="container">
        <div class="blog-grid" id="blog-posts"></div>
      </div>
    </main>

    <div class="modal fade" id="postModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="postModalLabel"></h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="postModalBody"></div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="container footer-inner">
        <div>© 2025 Guru Creations</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="PORTFOLIO.HTML">Portfolio</a>
          <a href="WEB DESIGN.HTML">Web Design</a>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/blog1.js"></script>
  </body>
</html>
